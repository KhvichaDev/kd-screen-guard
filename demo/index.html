<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kd-screen-guard Interactive Demo</title>
    <link rel="stylesheet" href="../dist/kd_styles.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 {
            margin-top: 0;
            color: #a8c7fa;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background-color: #a8c7fa;
            color: #121212;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #c3d8fc;
        }
        .btn-danger {
            background-color: #f2b8b5;
            color: #601410;
        }
        .btn-danger:hover {
            background-color: #f9dedc;
        }
        .status-box {
            margin-top: 20px;
            padding: 16px;
            background-color: #2a2a2a;
            border-radius: 8px;
            border-left: 4px solid #a8c7fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ kd-screen-guard Live Demo</h1>
        <p>Interactive demonstration of WebAuthn Biometrics, Intruder Webcam Snapshot, Off-Main-Thread Crypto, and Built-in Siren.</p>

        <div class="status-box">
            <strong>Status:</strong> <span id="status-text">Initialized & Unlocked 🔓</span>
        </div>

        <div class="btn-group">
            <button id="btn-lock">🔒 Lock Screen Now</button>
            <button id="btn-biometric">👆 Test WebAuthn Registration</button>
            <button id="btn-siren" class="btn-danger">🚨 Test Siren Sound</button>
        </div>

        <div id="header-actions" style="margin-top: 30px;">
            <h3>Attached Header Lock Icon Component:</h3>
        </div>
    </div>

    <script type="module">
        import ScreenGuard from '../dist/index.mjs';

        const guard = new ScreenGuard({
            password: '1234',
            salt: 'demo-salt-2026',
            autoLockMinutes: 3,
            enableWebAuthn: true,
            enableIntruderSnapshot: true,
            enableAudioAlarm: true,
            onStateChange: (state) => {
                const statusEl = document.getElementById('status-text');
                if (statusEl) {
                    statusEl.textContent = state.isLocked ? 'Locked 🔒' : 'Unlocked 🔓';
                }
            }
        });

        await guard.init();
        guard.attachLockButton('#header-actions');

        document.getElementById('btn-lock').onclick = () => guard.lock();

        document.getElementById('btn-biometric').onclick = async () => {
            if (await ScreenGuard.isBiometricsSupported()) {
                const credId = await ScreenGuard.registerBiometrics('Demo User');
                alert(credId ? 'Biometric Registered Successfully!' : 'Biometric Registration Canceled.');
            } else {
                alert('WebAuthn biometrics not supported on this device/browser.');
            }
        };

        document.getElementById('btn-siren').onclick = () => {
            alert('Triggering test siren...');
            guard.lock();
        };
    </script>
</body>
</html>
