<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kd-screen-guard Interactive Demo</title>
    <link rel="stylesheet" href="../dist/kd_styles.css?v=1.0.5">
    <style>
        body {
            font-family: 'Google Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 {
            margin-top: 0;
            color: #a8c7fa;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background-color: #a8c7fa;
            color: #121212;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #c3d8fc;
        }
        .btn-danger {
            background-color: #f2b8b5;
            color: #601410;
        }
        .btn-danger:hover {
            background-color: #f9dedc;
        }
        .status-box {
            margin-top: 20px;
            padding: 16px;
            background-color: #2a2a2a;
            border-radius: 8px;
            border-left: 4px solid #a8c7fa;
        }
        #debug-log {
            margin-top: 15px;
            font-family: monospace;
            font-size: 12px;
            color: #f2b8b5;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ kd-screen-guard Live Demo</h1>
        <p>Interactive demonstration of WebAuthn Biometrics, Intruder Webcam Snapshot, Off-Main-Thread Crypto, and Built-in Siren.</p>

        <div class="status-box">
            <strong>Status:</strong> <span id="status-text">Initializing...</span>
            <div id="debug-log"></div>
        </div>

        <div class="btn-group">
            <button type="button" id="btn-lock">🔒 Lock Screen Now</button>
            <button type="button" id="btn-biometric">👆 Test WebAuthn Registration</button>
            <button type="button" id="btn-siren" class="btn-danger">🚨 Test Siren Sound</button>
        </div>

        <div id="header-actions" style="margin-top: 30px;">
            <h3>Attached Header Lock Icon Component:</h3>
        </div>
    </div>

    <!-- Standalone Global Browser Bundle with Cache-Buster v1.0.5 -->
    <script src="../dist/index.global.js?v=1.0.5"></script>

    <script>
        function logDebug(msg) {
            const el = document.getElementById('debug-log');
            if (el) el.textContent += msg + '\n';
        }

        window.onerror = function (msg, url, line) {
            logDebug('Global Error: ' + msg + ' at line ' + line);
        };

        document.addEventListener('DOMContentLoaded', async function () {
            try {
                const lib = window.ScreenGuardLib || window;
                const ScreenGuardClass = lib.ScreenGuard || lib.default;

                if (!ScreenGuardClass) {
                    logDebug('ScreenGuard library class not found in window.ScreenGuardLib.');
                    return;
                }

                const guard = new ScreenGuardClass({
                    password: '1234',
                    salt: 'demo-salt-2026',
                    autoLockMinutes: 3,
                    enableWebAuthn: true,
                    enableIntruderSnapshot: true,
                    enableAudioAlarm: true,
                    enableSpeechAlarm: true,
                    speechMessage: 'Security Alert! System is Locked.',
                    onStateChange: function (state) {
                        const statusEl = document.getElementById('status-text');
                        if (statusEl) {
                            statusEl.textContent = state.isLocked ? 'Locked 🔒' : 'Unlocked 🔓';
                        }
                    }
                });

                await guard.init();
                guard.attachLockButton('#header-actions');

                const statusEl = document.getElementById('status-text');
                if (statusEl) statusEl.textContent = 'Initialized & Unlocked 🔓';

                const btnLock = document.getElementById('btn-lock');
                const btnBiometric = document.getElementById('btn-biometric');
                const btnSiren = document.getElementById('btn-siren');

                if (btnLock) {
                    btnLock.onclick = function () {
                        try {
                            guard.lock();
                        } catch (err) {
                            logDebug('Lock error: ' + err.message);
                        }
                    };
                }

                if (btnBiometric) {
                    btnBiometric.onclick = async function () {
                        try {
                            if (await ScreenGuardClass.isBiometricsSupported()) {
                                const credId = await ScreenGuardClass.registerBiometrics('Demo User');
                                alert(credId ? 'Biometric Registered Successfully!' : 'Biometric Registration Canceled.');
                            } else {
                                alert('WebAuthn biometrics not supported on this device/browser.');
                            }
                        } catch (err) {
                            logDebug('Biometrics error: ' + err.message);
                        }
                    };
                }

                if (btnSiren) {
                    btnSiren.onclick = function () {
                        guard.lock();
                    };
                }
            } catch (err) {
                logDebug('Init Error: ' + err.message + '\nStack: ' + err.stack);
            }
        });
    </script>
</body>
</html>
